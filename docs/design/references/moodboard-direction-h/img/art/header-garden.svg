<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hlf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7D6B4" stop-opacity=".22"/>
      <stop offset="1" stop-color="#C9B18A" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="hlf2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7D6B4" stop-opacity=".16"/>
      <stop offset="1" stop-color="#2E5A41" stop-opacity=".05"/>
    </linearGradient>
    <radialGradient id="hglow">
      <stop offset="0" stop-color="#C9B18A" stop-opacity=".2"/>
      <stop offset="1" stop-color="#C9B18A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hglowG">
      <stop offset="0" stop-color="#2E5A41" stop-opacity=".26"/>
      <stop offset="1" stop-color="#2E5A41" stop-opacity="0"/>
    </radialGradient>

    <!-- anthurium heart with prominent venation -->
    <g id="hacleaf">
      <path d="M0 -300 C 26 -238 66 -182 84 -112 C 98 -56 90 -6 58 26 C 40 36 20 26 8 8 L0 20 L-8 8 C -20 26 -40 36 -58 26 C -90 -6 -98 -56 -84 -112 C -66 -182 -26 -238 0 -300 Z" fill="url(#hlf)" stroke="#E7D6B4" stroke-opacity=".22" stroke-width="1.2"/>
      <path d="M0 -288 C 0 -190 0 -90 0 12" stroke="#E7D6B4" stroke-opacity=".36" stroke-width="1.5" fill="none"/>
      <path d="M0 -250 C 24 -228 52 -196 68 -152 M0 -250 C -24 -228 -52 -196 -68 -152 M0 -196 C 26 -176 56 -142 74 -98 M0 -196 C -26 -176 -56 -142 -74 -98 M0 -138 C 24 -122 52 -92 68 -52 M0 -138 C -24 -122 -52 -92 -68 -52 M0 -84 C 18 -72 38 -50 50 -22 M0 -84 C -18 -72 -38 -50 -50 -22" stroke="#E7D6B4" stroke-opacity=".28" stroke-width="1.1" fill="none"/>
      <path d="M22 -224 C 36 -204 48 -180 56 -154 M-22 -224 C -36 -204 -48 -180 -56 -154 M26 -168 C 40 -148 52 -124 60 -98 M-26 -168 C -40 -148 -52 -124 -60 -98 M22 -110 C 34 -94 44 -74 52 -50 M-22 -110 C -34 -94 -44 -74 -52 -50" stroke="#E7D6B4" stroke-opacity=".14" stroke-width=".85" fill="none"/>
    </g>

    <!-- warocqueanum: elongated heart -->
    <g id="hwleaf">
      <use href="#hacleaf" transform="scale(.66,1.16)"/>
    </g>

    <!-- monstera split leaf -->
    <g id="hlobe">
      <path d="M0 0 C 30 -11 68 -16 112 -9 C 82 -42 40 -51 9 -35 C 3 -22 0 -11 0 0 Z" fill="url(#hlf)" stroke="#E7D6B4" stroke-opacity=".2" stroke-width="1.15"/>
      <path d="M3 -5 C 33 -14 66 -18 100 -13" stroke="#E7D6B4" stroke-opacity=".12" stroke-width=".85" fill="none"/>
    </g>
    <g id="hmleaf">
      <path d="M0 0 C -6 -102 -5 -196 0 -278" stroke="#E7D6B4" stroke-opacity=".24" stroke-width="1.4" fill="none"/>
      <use href="#hlobe" transform="translate(2,-32) rotate(-16) scale(1.06)"/>
      <use href="#hlobe" transform="translate(2,-98) rotate(-10) scale(.95)"/>
      <use href="#hlobe" transform="translate(3,-160) rotate(-5) scale(.8)"/>
      <use href="#hlobe" transform="translate(2,-220) rotate(0) scale(.55)"/>
      <use href="#hlobe" transform="translate(-2,-32) rotate(196) scale(1.06)"/>
      <use href="#hlobe" transform="translate(-2,-98) rotate(190) scale(.95)"/>
      <use href="#hlobe" transform="translate(-3,-160) rotate(185) scale(.8)"/>
      <use href="#hlobe" transform="translate(-2,-220) rotate(180) scale(.55)"/>
      <path d="M0 -278 C 10 -261 12 -242 6 -227 M0 -278 C -10 -261 -12 -242 -6 -227" fill="url(#hlf)" stroke="#E7D6B4" stroke-opacity=".2" stroke-width="1"/>
      <ellipse cx="13" cy="-82" rx="8" ry="16" transform="rotate(14 13 -82)" stroke="#E7D6B4" stroke-opacity=".16" stroke-width=".9" fill="none"/>
      <ellipse cx="-13" cy="-82" rx="8" ry="16" transform="rotate(-14 -13 -82)" stroke="#E7D6B4" stroke-opacity=".16" stroke-width=".9" fill="none"/>
    </g>

    <!-- symmetric side cluster -->
    <g id="hedge">
      <use href="#hacleaf" transform="translate(120,566) rotate(-15) scale(1.02)"/>
      <use href="#hmleaf" transform="translate(268,582) rotate(-3) scale(.8)"/>
      <use href="#hwleaf" transform="translate(30,588) rotate(-26) scale(.8)"/>
    </g>
  </defs>

  <!-- symmetric ambient light -->
  <circle cx="700" cy="150" r="380" fill="url(#hglow)"/>
  <circle cx="200" cy="470" r="330" fill="url(#hglowG)"/>
  <circle cx="1200" cy="470" r="330" fill="url(#hglowG)"/>

  <!-- mirrored clusters: left and right -->
  <use href="#hedge"/>
  <use href="#hedge" transform="translate(1400,0) scale(-1,1)"/>

  <!-- symmetric whisper pair at center -->
  <use href="#hacleaf" transform="translate(660,610) rotate(-5) scale(.42)"/>
  <use href="#hacleaf" transform="translate(740,610) rotate(5) scale(-.42,.42)"/>

  <!-- symmetric stem arcs -->
  <path d="M700 60 C 560 130 460 240 420 380" stroke="#E7D6B4" stroke-opacity=".09" stroke-width="1.1" fill="none"/>
  <path d="M700 60 C 840 130 940 240 980 380" stroke="#E7D6B4" stroke-opacity=".09" stroke-width="1.1" fill="none"/>
</svg>
