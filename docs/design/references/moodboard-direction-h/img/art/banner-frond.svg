<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="blf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7D6B4" stop-opacity=".2"/>
      <stop offset="1" stop-color="#C9B18A" stop-opacity=".03"/>
    </linearGradient>
    <radialGradient id="bglow">
      <stop offset="0" stop-color="#C9B18A" stop-opacity=".18"/>
      <stop offset="1" stop-color="#C9B18A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bglowG">
      <stop offset="0" stop-color="#2E5A41" stop-opacity=".24"/>
      <stop offset="1" stop-color="#2E5A41" stop-opacity="0"/>
    </radialGradient>

    <!-- anthurium heart with venation -->
    <g id="bacleaf">
      <path d="M0 -260 C 22 -206 57 -158 73 -98 C 85 -49 78 -5 50 23 C 35 31 17 23 7 7 L0 18 L-7 7 C -17 23 -35 31 -50 23 C -78 -5 -85 -49 -73 -98 C -57 -158 -22 -206 0 -260 Z" fill="url(#blf)" stroke="#E7D6B4" stroke-opacity=".2" stroke-width="1.1"/>
      <path d="M0 -250 C 0 -164 0 -78 0 11" stroke="#E7D6B4" stroke-opacity=".33" stroke-width="1.35" fill="none"/>
      <path d="M0 -216 C 21 -198 45 -170 59 -132 M0 -216 C -21 -198 -45 -170 -59 -132 M0 -170 C 22 -152 48 -123 64 -85 M0 -170 C -22 -152 -48 -123 -64 -85 M0 -120 C 21 -106 45 -80 59 -45 M0 -120 C -21 -106 -45 -80 -59 -45 M0 -73 C 16 -62 33 -43 43 -19 M0 -73 C -16 -62 -33 -43 -43 -19" stroke="#E7D6B4" stroke-opacity=".25" stroke-width="1" fill="none"/>
      <path d="M19 -194 C 31 -177 42 -156 49 -134 M-19 -194 C -31 -177 -42 -156 -49 -134 M23 -146 C 35 -129 45 -108 52 -85 M-23 -146 C -35 -129 -45 -108 -52 -85" stroke="#E7D6B4" stroke-opacity=".12" stroke-width=".8" fill="none"/>
    </g>

    <!-- monstera split leaf -->
    <g id="blobe">
      <path d="M0 0 C 26 -10 60 -14 98 -8 C 72 -37 35 -45 8 -31 C 2 -19 0 -10 0 0 Z" fill="url(#blf)" stroke="#E7D6B4" stroke-opacity=".19" stroke-width="1.05"/>
      <path d="M2 -4 C 29 -12 58 -16 88 -11" stroke="#E7D6B4" stroke-opacity=".11" stroke-width=".8" fill="none"/>
    </g>
    <g id="bmleaf">
      <path d="M0 0 C -5 -88 -4 -170 0 -244" stroke="#E7D6B4" stroke-opacity=".23" stroke-width="1.3" fill="none"/>
      <use href="#blobe" transform="translate(2,-28) rotate(-16) scale(1.02)"/>
      <use href="#blobe" transform="translate(2,-86) rotate(-10) scale(.9)"/>
      <use href="#blobe" transform="translate(2,-142) rotate(-5) scale(.74)"/>
      <use href="#blobe" transform="translate(2,-194) rotate(0) scale(.52)"/>
      <use href="#blobe" transform="translate(-2,-28) rotate(196) scale(1.02)"/>
      <use href="#blobe" transform="translate(-2,-86) rotate(190) scale(.9)"/>
      <use href="#blobe" transform="translate(-2,-142) rotate(185) scale(.74)"/>
      <use href="#blobe" transform="translate(-2,-194) rotate(180) scale(.52)"/>
      <path d="M0 -244 C 8 -229 10 -212 5 -198 M0 -244 C -8 -229 -10 -212 -5 -198" fill="url(#blf)" stroke="#E7D6B4" stroke-opacity=".19" stroke-width=".95"/>
      <ellipse cx="11" cy="-72" rx="7" ry="14" transform="rotate(14 11 -72)" stroke="#E7D6B4" stroke-opacity=".15" stroke-width=".85" fill="none"/>
      <ellipse cx="-11" cy="-72" rx="7" ry="14" transform="rotate(-14 -11 -72)" stroke="#E7D6B4" stroke-opacity=".15" stroke-width=".85" fill="none"/>
    </g>

    <!-- symmetric pair (banner title sits left) -->
    <g id="bpair">
      <use href="#bacleaf" transform="translate(1020,388) rotate(12) scale(.82)"/>
      <use href="#bmleaf" transform="translate(1150,396) rotate(22) scale(.68)"/>
    </g>
  </defs>

  <circle cx="1040" cy="120" r="280" fill="url(#bglow)"/>
  <circle cx="880" cy="330" r="240" fill="url(#bglowG)"/>

  <!-- mirrored pair: composition, not scatter -->
  <use href="#bpair"/>
  <use href="#bpair" transform="translate(2260,0) scale(-1,1)"/>

  <path d="M700 360 C 820 260 960 200 1120 172" stroke="#E7D6B4" stroke-opacity=".09" stroke-width="1.1" fill="none"/>
  <path d="M1380 360 C 1260 260 1120 200 960 172" stroke="#E7D6B4" stroke-opacity=".07" stroke-width="1.1" fill="none"/>
</svg>
