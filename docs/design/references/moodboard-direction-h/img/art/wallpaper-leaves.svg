<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9B18A" stop-opacity=".12"/>
      <stop offset="1" stop-color="#C9B18A" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="lf2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7D6B4" stop-opacity=".10"/>
      <stop offset="1" stop-color="#2E5A41" stop-opacity=".03"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#C9B18A" stop-opacity=".11"/>
      <stop offset="1" stop-color="#C9B18A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG">
      <stop offset="0" stop-color="#2E5A41" stop-opacity=".15"/>
      <stop offset="1" stop-color="#2E5A41" stop-opacity="0"/>
    </radialGradient>

    <!-- anthurium heart: crystallinum blade with prominent venation -->
    <g id="acleaf">
      <path d="M0 -300 C 26 -238 66 -182 84 -112 C 98 -56 90 -6 58 26 C 40 36 20 26 8 8 L0 20 L-8 8 C -20 26 -40 36 -58 26 C -90 -6 -98 -56 -84 -112 C -66 -182 -26 -238 0 -300 Z" fill="url(#lf)" stroke="#C9B18A" stroke-opacity=".17" stroke-width="1.15"/>
      <path d="M0 -288 C 0 -190 0 -90 0 12" stroke="#C9B18A" stroke-opacity=".3" stroke-width="1.4" fill="none"/>
      <path d="M0 -250 C 24 -228 52 -196 68 -152 M0 -250 C -24 -228 -52 -196 -68 -152 M0 -196 C 26 -176 56 -142 74 -98 M0 -196 C -26 -176 -56 -142 -74 -98 M0 -138 C 24 -122 52 -92 68 -52 M0 -138 C -24 -122 -52 -92 -68 -52 M0 -84 C 18 -72 38 -50 50 -22 M0 -84 C -18 -72 -38 -50 -50 -22" stroke="#C9B18A" stroke-opacity=".24" stroke-width="1.05" fill="none"/>
      <path d="M22 -224 C 36 -204 48 -180 56 -154 M-22 -224 C -36 -204 -48 -180 -56 -154 M26 -168 C 40 -148 52 -124 60 -98 M-26 -168 C -40 -148 -52 -124 -60 -98 M22 -110 C 34 -94 44 -74 52 -50 M-22 -110 C -34 -94 -44 -74 -52 -50" stroke="#C9B18A" stroke-opacity=".12" stroke-width=".8" fill="none"/>
    </g>

    <!-- monstera split leaf -->
    <g id="lobe">
      <path d="M0 0 C 32 -12 74 -18 122 -10 C 90 -46 44 -56 10 -38 C 3 -24 0 -12 0 0 Z" fill="url(#lf)" stroke="#C9B18A" stroke-opacity=".15" stroke-width="1.1"/>
      <path d="M3 -5 C 36 -15 72 -19 108 -14" stroke="#C9B18A" stroke-opacity=".1" stroke-width=".8" fill="none"/>
    </g>
    <g id="mleaf">
      <path d="M0 0 C -6 -110 -5 -210 0 -300" stroke="#C9B18A" stroke-opacity=".19" stroke-width="1.4" fill="none"/>
      <use href="#lobe" transform="translate(2,-34) rotate(-16) scale(1.08)"/>
      <use href="#lobe" transform="translate(2,-104) rotate(-10) scale(.98)"/>
      <use href="#lobe" transform="translate(3,-172) rotate(-5) scale(.82)"/>
      <use href="#lobe" transform="translate(2,-236) rotate(0) scale(.58)"/>
      <use href="#lobe" transform="translate(-2,-34) rotate(196) scale(1.08)"/>
      <use href="#lobe" transform="translate(-2,-104) rotate(190) scale(.98)"/>
      <use href="#lobe" transform="translate(-3,-172) rotate(185) scale(.82)"/>
      <use href="#lobe" transform="translate(-2,-236) rotate(180) scale(.58)"/>
      <path d="M0 -300 C 10 -282 12 -262 6 -246 M0 -300 C -10 -282 -12 -262 -6 -246" fill="url(#lf)" stroke="#C9B18A" stroke-opacity=".15" stroke-width="1"/>
      <ellipse cx="14" cy="-88" rx="9" ry="17" transform="rotate(14 14 -88)" stroke="#C9B18A" stroke-opacity=".13" stroke-width=".9" fill="none"/>
      <ellipse cx="-14" cy="-88" rx="9" ry="17" transform="rotate(-14 -14 -88)" stroke="#C9B18A" stroke-opacity=".13" stroke-width=".9" fill="none"/>
      <ellipse cx="11" cy="-152" rx="7" ry="13" transform="rotate(12 11 -152)" stroke="#C9B18A" stroke-opacity=".11" stroke-width=".9" fill="none"/>
      <ellipse cx="-11" cy="-152" rx="7" ry="13" transform="rotate(-12 -11 -152)" stroke="#C9B18A" stroke-opacity=".11" stroke-width=".9" fill="none"/>
    </g>

    <!-- alocasia arrowhead -->
    <g id="aleaf">
      <path d="M0 -300 C 30 -224 74 -148 92 -66 C 102 -22 92 20 68 46 C 52 22 30 8 12 8 L0 22 L-12 8 C -30 8 -52 22 -68 46 C -92 20 -102 -22 -92 -66 C -74 -148 -30 -224 0 -300 Z" fill="url(#lf2)" stroke="#C9B18A" stroke-opacity=".18" stroke-width="1.2"/>
      <path d="M0 -288 L0 14" stroke="#C9B18A" stroke-opacity=".2" stroke-width="1.3" fill="none"/>
      <path d="M0 -240 C 26 -212 54 -172 72 -122 M0 -240 C -26 -212 -54 -172 -72 -122 M0 -170 C 24 -146 50 -112 66 -70 M0 -170 C -24 -146 -50 -112 -66 -70 M0 -104 C 18 -86 36 -62 48 -32 M0 -104 C -18 -86 -36 -62 -48 -32" stroke="#C9B18A" stroke-opacity=".16" stroke-width="1" fill="none"/>
    </g>

    <!-- symmetric edge cluster (left side; mirrored for right) -->
    <g id="edge">
      <use href="#acleaf" transform="translate(150,390) rotate(-13) scale(1.05)"/>
      <use href="#mleaf" transform="translate(64,760) rotate(-22) scale(.95)"/>
      <use href="#acleaf" transform="translate(190,1120) rotate(-7) scale(.82)"/>
      <use href="#aleaf" transform="translate(70,1440) rotate(-17) scale(.78)"/>
    </g>
    <!-- symmetric crown pair -->
    <g id="crown">
      <use href="#acleaf" transform="translate(568,120) rotate(-8) scale(.6)"/>
      <use href="#mleaf" transform="translate(700,150) rotate(3) scale(.5)"/>
    </g>
  </defs>

  <!-- ambient light: symmetric -->
  <circle cx="600" cy="330" r="520" fill="url(#glow)"/>
  <circle cx="600" cy="1380" r="520" fill="url(#glowG)"/>

  <!-- mirrored edge frames: clean center for content -->
  <use href="#edge"/>
  <use href="#edge" transform="translate(1200,0) scale(-1,1)"/>

  <!-- mirrored crowns -->
  <use href="#crown"/>
  <use href="#crown" transform="translate(1200,0) scale(-1,1)"/>
  <use href="#crown" transform="translate(1200,1600) rotate(180)"/>
  <use href="#crown" transform="translate(0,1600) rotate(180) scale(-1,1)"/>

  <!-- symmetric center stem arcs -->
  <path d="M600 1560 C 600 1200 600 900 600 640" stroke="#C9B18A" stroke-opacity=".05" stroke-width="1.1" fill="none"/>
  <path d="M600 80 C 430 150 300 260 220 420" stroke="#C9B18A" stroke-opacity=".055" stroke-width="1.1" fill="none"/>
  <path d="M600 80 C 770 150 900 260 980 420" stroke="#C9B18A" stroke-opacity=".055" stroke-width="1.1" fill="none"/>
</svg>
