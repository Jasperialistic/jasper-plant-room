name: ChatGPT Visual Evidence Bridge

on:
  push:
    paths:
      - '.chatgpt-evidence-request'

permissions:
  contents: write

jobs:
  mirror-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch selected evidence image
        shell: bash
        run: |
          set -euo pipefail
          URL="$(tr -d '\r\n' < .chatgpt-evidence-request)"
          test -n "$URL"
          curl -fL --retry 3 --retry-delay 2 "$URL" -o /tmp/evidence.jpg
          BYTES=$(wc -c < /tmp/evidence.jpg)
          test "$BYTES" -gt 10000
          echo "Fetched $BYTES bytes"

      - name: Upload temporary evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: plant-visual-evidence
          path: /tmp/evidence.jpg
          retention-days: 1
          if-no-files-found: error

      - name: Publish bridge pointer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan chatgpt-visual-bridge
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/evidence.jpg evidence.jpg
          printf '%s\n' "${GITHUB_RUN_ID}" > run-id.txt
          git add evidence.jpg run-id.txt
          git commit -m "Refresh ChatGPT visual evidence"
          git push --force origin HEAD:chatgpt-visual-bridge
