name: Mobile gallery cache bust

on:
  push:
    paths:
      - 'v36-mobile-gallery.js'

permissions:
  contents: write

jobs:
  load-mobile-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load mobile gallery asset
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '  <script src="v36-mobile-gallery.js?v=3.9.0"></script>'
          pattern = r'\s*<script src="v36-mobile-gallery\.js(?:\?v=[^"]*)?"></script>'

          if re.search(pattern, s):
              s2 = re.sub(pattern, '\n' + tag, s, count=1)
          else:
              viewer_pattern = r'(<script src="v25-photo-viewer\.js(?:\?v=[^"]*)?"></script>)'
              s2, n = re.subn(viewer_pattern, r'\1\n' + tag.strip(), s, count=1)
              if n == 0:
                  raise SystemExit('v25-photo-viewer.js script tag not found')

          p.write_text(s2, encoding='utf-8')
      - name: Commit mobile gallery loader
        shell: bash
        run: |
          set -e
          if git diff --quiet -- index.html; then
            echo 'Mobile gallery v3.9.0 already loaded'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load mobile gallery UX v3.9.0'
          git push
