name: Plant Room v2.2 patch

on:
  push:
    paths:
      - '.github/workflows/plant-room-ui-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Apply v2.2 site patch
        shell: python
        run: |
          import base64, subprocess, zlib
          from pathlib import Path

          page = Path('index.html')
          text = page.read_text(encoding='utf-8')
          marker = 'Cloud build v2.2: full gallery manager + interactive grow zones'
          if marker in text:
              print('v2.2 already applied')
          else:
              encoded = Path('.github/patches/v22.patch.zlib.b64').read_text(encoding='utf-8').strip()
              patch = zlib.decompress(base64.b64decode(encoded))
              patch_path = Path('/tmp/v22.patch')
              patch_path.write_bytes(patch)
              subprocess.run(['git','apply','--check',str(patch_path)], check=True)
              subprocess.run(['git','apply',str(patch_path)], check=True)
              print('v2.2 patch applied')

      - name: Commit patched site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No site changes to commit"
          else
            git commit -m "Add gallery manager and interactive grow zones"
            git push
          fi
