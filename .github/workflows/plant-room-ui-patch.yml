name: Plant Room v2.4 patch

on:
  push:
    paths:
      - '.github/workflows/plant-room-ui-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Apply v2.4 photo viewer patch
        shell: python
        run: |
          import base64, subprocess, zlib, re
          from pathlib import Path

          page = Path('index.html')
          text = page.read_text(encoding='utf-8')
          marker = 'Cloud build v2.4: album-style photo viewer'
          if marker in text:
              print('v2.4 already applied')
          else:
              encoded = Path('.github/patches/v24.patch.zlib.b64').read_text(encoding='utf-8').strip()
              patch = zlib.decompress(base64.b64decode(encoded))
              patch_path = Path('/tmp/v24.patch')
              patch_path.write_bytes(patch)
              subprocess.run(['git','apply','--check',str(patch_path)], check=True)
              subprocess.run(['git','apply',str(patch_path)], check=True)
              text = page.read_text(encoding='utf-8')
              required = ['id="mainPhoto"','data-gallery-preview','function bindPlantPhotoViewer(p)','id=\'photoLightbox\'','function openPhotoLightbox(p,key)']
              missing = [x for x in required if x not in text]
              if missing:
                  raise SystemExit('Missing v2.4 markers: ' + ', '.join(missing))
              scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
              Path('/tmp/plant-v24-app.js').write_text(scripts[-1], encoding='utf-8')
              print('v2.4 patch applied')

      - name: Check JavaScript syntax
        run: |
          if [ -f /tmp/plant-v24-app.js ]; then node --check /tmp/plant-v24-app.js; fi

      - name: Commit patched site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No site changes to commit"
          else
            git commit -m "Add album-style photo viewer"
            git push
          fi
