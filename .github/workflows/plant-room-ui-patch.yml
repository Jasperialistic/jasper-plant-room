name: Plant Room v3.1 direct Telegram share

on:
  push:
    paths:
      - '.github/workflows/plant-room-ui-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Patch v3.1 direct Telegram share
        shell: python
        run: |
          import re
          from pathlib import Path

          page=Path('index.html')
          text=page.read_text(encoding='utf-8')
          old_marker='Cloud build v3.0: compact growth timeline gallery'
          new_marker='Cloud build v3.1: direct Telegram plant share'
          v30='<script src="v30-growth-gallery.js?v=3.0.0"></script>'
          v31='<script src="v31-telegram-share.js?v=3.1.0"></script>'
          changed=False

          if new_marker not in text:
              if old_marker not in text:
                  raise SystemExit('Expected v3.0 build marker not found')
              text=text.replace(old_marker,new_marker,1)
              changed=True

          if v31 not in text:
              if v30 in text:
                  text=text.replace(v30,v30+'\n  '+v31,1)
              elif '</body>' in text:
                  text=text.replace('</body>','  '+v31+'\n</body>',1)
              else:
                  raise SystemExit('Closing body tag not found')
              changed=True

          required=['function openPlant(','v30-growth-gallery.js?v=3.0.0','v31-telegram-share.js?v=3.1.0']
          missing=[x for x in required if x not in text]
          if missing:
              raise SystemExit('Missing Telegram share markers: '+', '.join(missing))

          if changed:
              page.write_text(text,encoding='utf-8')
              print('v3.1 direct Telegram share hook installed')
          else:
              print('v3.1 already installed')

          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S)
          if scripts:
              Path('/tmp/plant-inline-app.js').write_text(scripts[-1],encoding='utf-8')

      - name: Check JavaScript syntax
        run: |
          node --check v25-photo-viewer.js
          node --check v26-photo-fit.js
          node --check v27-permanent-delete.js
          node --check v28-chatgpt-share.js
          node --check v30-growth-gallery.js
          node --check v31-telegram-share.js
          if [ -s /tmp/plant-inline-app.js ]; then node --check /tmp/plant-inline-app.js; fi

      - name: Commit updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No site changes to commit"
          else
            git commit -m "Add direct Telegram plant share"
            git push
          fi
