name: Plant Room v2.9 actual photo sharing

on:
  push:
    paths:
      - '.github/workflows/plant-room-ui-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Patch v2.9 actual photo sharing
        shell: python
        run: |
          import re
          from pathlib import Path

          page=Path('index.html')
          text=page.read_text(encoding='utf-8')
          old_marker='Cloud build v2.8: Share with ChatGPT plant reference'
          new_marker='Cloud build v2.9: Share actual plant photos with ChatGPT'
          old_script='<script src="v28-chatgpt-share.js?v=2.8.0"></script>'
          new_script='<script src="v28-chatgpt-share.js?v=2.9.0"></script>'
          changed=False

          if new_marker not in text:
              if old_marker not in text:
                  raise SystemExit('Expected v2.8 build marker not found')
              text=text.replace(old_marker,new_marker,1)
              changed=True

          if new_script not in text:
              if old_script not in text:
                  raise SystemExit('Expected v2.8 share script hook not found')
              text=text.replace(old_script,new_script,1)
              changed=True

          required=['id="addPlantForm"','function openPlant(','v27-permanent-delete.js','v28-chatgpt-share.js?v=2.9.0']
          missing=[x for x in required if x not in text]
          if missing:
              raise SystemExit('Missing required markers: '+', '.join(missing))

          if changed:
              page.write_text(text,encoding='utf-8')
              print('v2.9 photo-file sharing hook installed')
          else:
              print('v2.9 already installed')

          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S)
          if scripts:
              Path('/tmp/plant-inline-app.js').write_text(scripts[-1],encoding='utf-8')

      - name: Check JavaScript syntax
        run: |
          node --check v25-photo-viewer.js
          node --check v26-photo-fit.js
          node --check v27-permanent-delete.js
          node --check v28-chatgpt-share.js
          if [ -s /tmp/plant-inline-app.js ]; then node --check /tmp/plant-inline-app.js; fi

      - name: Commit updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No site changes to commit"
          else
            git commit -m "Share actual plant photos with ChatGPT"
            git push
          fi
