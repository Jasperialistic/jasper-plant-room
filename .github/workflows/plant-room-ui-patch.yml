name: Plant Room v3.7 ChatGPT visual evidence bridge

on:
  push:
    paths:
      - '.github/workflows/plant-room-ui-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Patch v3.7 visual evidence bridge
        shell: python
        run: |
          import re
          from pathlib import Path

          page=Path('index.html')
          text=page.read_text(encoding='utf-8')
          old_marker='Cloud build v3.6.1: AI review reuse'
          new_marker='Cloud build v3.7: ChatGPT visual evidence bridge'
          old_v36='<script src="v36-ai-review.js?v=3.6.1"></script>'
          new_v36='<script src="v36-ai-review.js?v=3.7.0"></script>'
          changed=False

          if new_marker not in text:
              if old_marker not in text:
                  raise SystemExit('Expected v3.6.1 build marker not found')
              text=text.replace(old_marker,new_marker,1)
              changed=True

          if new_v36 not in text:
              if old_v36 not in text:
                  raise SystemExit('Expected v3.6.1 AI script hook not found')
              text=text.replace(old_v36,new_v36,1)
              changed=True

          required=['function openPlant(','v35-telegram-reference-packet.js?v=3.5.0','v36-ai-review.js?v=3.7.0']
          missing=[x for x in required if x not in text]
          if missing:
              raise SystemExit('Missing v3.7 visual evidence markers: '+', '.join(missing))

          if changed:
              page.write_text(text,encoding='utf-8')
              print('v3.7 ChatGPT visual evidence bridge installed')
          else:
              print('v3.7 already installed')

          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S)
          if scripts:
              Path('/tmp/plant-inline-app.js').write_text(scripts[-1],encoding='utf-8')

      - name: Check JavaScript syntax
        run: |
          node --check v25-photo-viewer.js
          node --check v26-photo-fit.js
          node --check v27-permanent-delete.js
          node --check v28-chatgpt-share.js
          node --check v30-growth-gallery.js
          node --check v31-telegram-share.js
          node --check v32-jasper-jungle-bot.js
          node --check v33-telegram-inbound.js
          node --check v34-plant-aliases.js
          node --check v35-telegram-reference-packet.js
          node --check v36-ai-review.js
          if [ -s /tmp/plant-inline-app.js ]; then node --check /tmp/plant-inline-app.js; fi

      - name: Commit updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No site changes to commit"
          else
            git commit -m "Enable ChatGPT visual evidence bridge"
            git push
          fi
