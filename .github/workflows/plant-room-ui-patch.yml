name: Plant Room v3.3 Telegram inbound archive

on:
  push:
    paths:
      - '.github/workflows/plant-room-ui-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Patch v3.3 inbound Telegram archive
        shell: python
        run: |
          import re
          from pathlib import Path

          page=Path('index.html')
          text=page.read_text(encoding='utf-8')
          old_marker='Cloud build v3.2: JasperJungleBot direct send'
          new_marker='Cloud build v3.3: Telegram inbound photo archive'
          v32='<script src="v32-jasper-jungle-bot.js?v=3.2.0"></script>'
          v33='<script src="v33-telegram-inbound.js?v=3.3.0"></script>'
          changed=False

          if new_marker not in text:
              if old_marker not in text:
                  raise SystemExit('Expected v3.2 build marker not found')
              text=text.replace(old_marker,new_marker,1)
              changed=True

          if v33 not in text:
              if v32 in text:
                  text=text.replace(v32,v32+'\n  '+v33,1)
              elif '</body>' in text:
                  text=text.replace('</body>','  '+v33+'\n</body>',1)
              else:
                  raise SystemExit('Closing body tag not found')
              changed=True

          required=['function openPlant(','v32-jasper-jungle-bot.js?v=3.2.0','v33-telegram-inbound.js?v=3.3.0']
          missing=[x for x in required if x not in text]
          if missing:
              raise SystemExit('Missing Telegram inbound markers: '+', '.join(missing))

          if changed:
              page.write_text(text,encoding='utf-8')
              print('v3.3 Telegram inbound hook installed')
          else:
              print('v3.3 already installed')

          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S)
          if scripts:
              Path('/tmp/plant-inline-app.js').write_text(scripts[-1],encoding='utf-8')

      - name: Check JavaScript syntax
        run: |
          node --check v25-photo-viewer.js
          node --check v26-photo-fit.js
          node --check v27-permanent-delete.js
          node --check v28-chatgpt-share.js
          node --check v30-growth-gallery.js
          node --check v31-telegram-share.js
          node --check v32-jasper-jungle-bot.js
          node --check v33-telegram-inbound.js
          if [ -s /tmp/plant-inline-app.js ]; then node --check /tmp/plant-inline-app.js; fi

      - name: Commit updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No site changes to commit"
          else
            git commit -m "Enable Telegram photo archive workflow"
            git push
          fi
