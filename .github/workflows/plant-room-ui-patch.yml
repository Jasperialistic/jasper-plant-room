name: Plant Room v2.8 ChatGPT share

on:
  push:
    paths:
      - '.github/workflows/plant-room-ui-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Patch v2.8 Share with ChatGPT
        shell: python
        run: |
          import re
          from pathlib import Path

          page=Path('index.html')
          text=page.read_text(encoding='utf-8')
          old_marker='Cloud build v2.7: permanent bundled-photo delete'
          new_marker='Cloud build v2.8: Share with ChatGPT plant reference'
          v27='<script src="v27-permanent-delete.js?v=2.7.0"></script>'
          v28='<script src="v28-chatgpt-share.js?v=2.8.0"></script>'
          changed=False

          if new_marker not in text:
              if old_marker not in text:
                  raise SystemExit('Expected v2.7 build marker not found')
              text=text.replace(old_marker,new_marker,1)
              changed=True

          if v28 not in text:
              if v27 in text:
                  text=text.replace(v27,v27+'\n  '+v28,1)
              elif '</body>' in text:
                  text=text.replace('</body>','  '+v28+'\n</body>',1)
              else:
                  raise SystemExit('Closing body tag not found')
              changed=True

          required=['id="addPlantForm"','function openPlant(','v27-permanent-delete.js','v28-chatgpt-share.js']
          missing=[x for x in required if x not in text]
          if missing:
              raise SystemExit('Missing required markers: '+', '.join(missing))

          if changed:
              page.write_text(text,encoding='utf-8')
              print('v2.8 ChatGPT share hook installed')
          else:
              print('v2.8 already installed')

          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S)
          if scripts:
              Path('/tmp/plant-inline-app.js').write_text(scripts[-1],encoding='utf-8')

      - name: Check JavaScript syntax
        run: |
          node --check v25-photo-viewer.js
          node --check v26-photo-fit.js
          node --check v27-permanent-delete.js
          node --check v28-chatgpt-share.js
          if [ -s /tmp/plant-inline-app.js ]; then node --check /tmp/plant-inline-app.js; fi

      - name: Commit updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No site changes to commit"
          else
            git commit -m "Add Share with ChatGPT plant workflow"
            git push
          fi
