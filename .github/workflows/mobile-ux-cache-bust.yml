name: Mobile UX cache bust

on:
  push:
    paths:
      - 'v25-photo-viewer.js'
      - 'v36-mobile-gallery.js'
      - 'v37-mobile-plant-screen.js'
      - 'v38-full-plant-editor.js'
      - 'v39-editor-polish.js'
      - 'v40-editor-access-tweaks.js'
      - 'v41-desktop-gallery-wheel.js'
      - 'v42-desktop-gallery-menu.js'
      - 'v43-desktop-gallery-menu-toplayer.js'
      - '.github/workflows/mobile-ux-cache-bust.yml'

permissions:
  contents: write

jobs:
  bump-mobile-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load current mobile UX assets
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s2, n = re.subn(
              r'v25-photo-viewer\.js(?:\?v=[^"\']*)?',
              'v25-photo-viewer.js?v=3.8.0',
              s,
          )
          if n == 0:
              raise SystemExit('v25-photo-viewer.js script tag not found')

          gallery_tag = '<script src="v36-mobile-gallery.js?v=3.9.0"></script>'
          gallery_pattern = r'<script src="v36-mobile-gallery\.js(?:\?v=[^"\']*)?"></script>'
          if re.search(gallery_pattern, s2):
              s2 = re.sub(gallery_pattern, gallery_tag, s2, count=1)
          else:
              viewer_pattern = r'(<script src="v25-photo-viewer\.js\?v=3\.8\.0"></script>)'
              s2, inserted = re.subn(viewer_pattern, r'\1\n  ' + gallery_tag, s2, count=1)
              if inserted == 0:
                  raise SystemExit('Could not place v36-mobile-gallery.js after mobile viewer')

          plant_tag = '<script src="v37-mobile-plant-screen.js?v=4.0.0"></script>'
          plant_pattern = r'<script src="v37-mobile-plant-screen\.js(?:\?v=[^"\']*)?"></script>'
          if re.search(plant_pattern, s2):
              s2 = re.sub(plant_pattern, plant_tag, s2, count=1)
          else:
              gallery_exact = r'(<script src="v36-mobile-gallery\.js\?v=3\.9\.0"></script>)'
              s2, inserted = re.subn(gallery_exact, r'\1\n  ' + plant_tag, s2, count=1)
              if inserted == 0:
                  raise SystemExit('Could not place v37-mobile-plant-screen.js after mobile gallery')

          editor_tag = '<script src="v38-full-plant-editor.js?v=4.1.0"></script>'
          editor_pattern = r'<script src="v38-full-plant-editor\.js(?:\?v=[^"\']*)?"></script>'
          if re.search(editor_pattern, s2):
              s2 = re.sub(editor_pattern, editor_tag, s2, count=1)
          else:
              plant_exact = r'(<script src="v37-mobile-plant-screen\.js\?v=4\.0\.0"></script>)'
              s2, inserted = re.subn(plant_exact, r'\1\n  ' + editor_tag, s2, count=1)
              if inserted == 0:
                  raise SystemExit('Could not place v38-full-plant-editor.js after mobile plant screen')

          polish_tag = '<script src="v39-editor-polish.js?v=4.2.0"></script>'
          polish_pattern = r'<script src="v39-editor-polish\.js(?:\?v=[^"\']*)?"></script>'
          if re.search(polish_pattern, s2):
              s2 = re.sub(polish_pattern, polish_tag, s2, count=1)
          else:
              editor_exact = r'(<script src="v38-full-plant-editor\.js\?v=4\.1\.0"></script>)'
              s2, inserted = re.subn(editor_exact, r'\1\n  ' + polish_tag, s2, count=1)
              if inserted == 0:
                  raise SystemExit('Could not place v39-editor-polish.js after full plant editor')

          access_tag = '<script src="v40-editor-access-tweaks.js?v=4.2.1"></script>'
          access_pattern = r'<script src="v40-editor-access-tweaks\.js(?:\?v=[^"\']*)?"></script>'
          if re.search(access_pattern, s2):
              s2 = re.sub(access_pattern, access_tag, s2, count=1)
          else:
              polish_exact = r'(<script src="v39-editor-polish\.js\?v=4\.2\.0"></script>)'
              s2, inserted = re.subn(polish_exact, r'\1\n  ' + access_tag, s2, count=1)
              if inserted == 0:
                  raise SystemExit('Could not place v40 editor access tweaks')

          desktop_tag = '<script src="v41-desktop-gallery-wheel.js?v=4.3.0"></script>'
          desktop_pattern = r'<script src="v41-desktop-gallery-wheel\.js(?:\?v=[^"\']*)?"></script>'
          if re.search(desktop_pattern, s2):
              s2 = re.sub(desktop_pattern, desktop_tag, s2, count=1)
          else:
              access_exact = r'(<script src="v40-editor-access-tweaks\.js\?v=4\.2\.1"></script>)'
              s2, inserted = re.subn(access_exact, r'\1\n  ' + desktop_tag, s2, count=1)
              if inserted == 0:
                  raise SystemExit('Could not place v41 desktop gallery/wheel layer')

          menu_tag = '<script src="v42-desktop-gallery-menu.js?v=4.3.1"></script>'
          menu_pattern = r'<script src="v42-desktop-gallery-menu\.js(?:\?v=[^"\']*)?"></script>'
          if re.search(menu_pattern, s2):
              s2 = re.sub(menu_pattern, menu_tag, s2, count=1)
          else:
              desktop_exact = r'(<script src="v41-desktop-gallery-wheel\.js\?v=4\.3\.0"></script>)'
              s2, inserted = re.subn(desktop_exact, r'\1\n  ' + menu_tag, s2, count=1)
              if inserted == 0:
                  raise SystemExit('Could not place v42 desktop gallery menu')

          top_tag = '<script src="v43-desktop-gallery-menu-toplayer.js?v=4.3.2"></script>'
          top_pattern = r'<script src="v43-desktop-gallery-menu-toplayer\.js(?:\?v=[^"\']*)?"></script>'
          if re.search(top_pattern, s2):
              s2 = re.sub(top_pattern, top_tag, s2, count=1)
          else:
              menu_exact = r'(<script src="v42-desktop-gallery-menu\.js\?v=4\.3\.1"></script>)'
              s2, inserted = re.subn(menu_exact, r'\1\n  ' + top_tag, s2, count=1)
              if inserted == 0:
                  raise SystemExit('Could not place v43 desktop gallery menu top-layer fix')

          p.write_text(s2, encoding='utf-8')
      - name: Commit mobile asset loader
        shell: bash
        run: |
          set -e
          if git diff --quiet -- index.html; then
            echo 'Mobile assets already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load desktop gallery menu top-layer fix v4.3.2'
          git push
