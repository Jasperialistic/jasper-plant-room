name: Mobile UX cache bust

on:
  push:
    paths:
      - 'v25-photo-viewer.js'
      - 'v36-mobile-gallery.js'
      - 'v37-mobile-plant-screen.js'
      - 'v38-full-plant-editor.js'
      - '.github/workflows/mobile-ux-cache-bust.yml'

permissions:
  contents: write

jobs:
  bump-mobile-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load current mobile UX assets
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s2, n = re.subn(
              r'v25-photo-viewer\.js(?:\?v=[^"\']*)?',
              'v25-photo-viewer.js?v=3.8.0',
              s,
          )
          if n == 0:
              raise SystemExit('v25-photo-viewer.js script tag not found')

          gallery_tag = '<script src="v36-mobile-gallery.js?v=3.9.0"></script>'
          gallery_pattern = r'<script src="v36-mobile-gallery\.js(?:\?v=[^"\']*)?"></script>'
          if re.search(gallery_pattern, s2):
              s2 = re.sub(gallery_pattern, gallery_tag, s2, count=1)
          else:
              viewer_pattern = r'(<script src="v25-photo-viewer\.js\?v=3\.8\.0"></script>)'
              s2, inserted = re.subn(viewer_pattern, r'\1\n  ' + gallery_tag, s2, count=1)
              if inserted == 0:
                  raise SystemExit('Could not place v36-mobile-gallery.js after mobile viewer')

          plant_tag = '<script src="v37-mobile-plant-screen.js?v=4.0.0"></script>'
          plant_pattern = r'<script src="v37-mobile-plant-screen\.js(?:\?v=[^"\']*)?"></script>'
          if re.search(plant_pattern, s2):
              s2 = re.sub(plant_pattern, plant_tag, s2, count=1)
          else:
              gallery_exact = r'(<script src="v36-mobile-gallery\.js\?v=3\.9\.0"></script>)'
              s2, inserted = re.subn(gallery_exact, r'\1\n  ' + plant_tag, s2, count=1)
              if inserted == 0:
                  raise SystemExit('Could not place v37-mobile-plant-screen.js after mobile gallery')

          editor_tag = '<script src="v38-full-plant-editor.js?v=4.1.0"></script>'
          editor_pattern = r'<script src="v38-full-plant-editor\.js(?:\?v=[^"\']*)?"></script>'
          if re.search(editor_pattern, s2):
              s2 = re.sub(editor_pattern, editor_tag, s2, count=1)
          else:
              plant_exact = r'(<script src="v37-mobile-plant-screen\.js\?v=4\.0\.0"></script>)'
              s2, inserted = re.subn(plant_exact, r'\1\n  ' + editor_tag, s2, count=1)
              if inserted == 0:
                  raise SystemExit('Could not place v38-full-plant-editor.js after mobile plant screen')

          p.write_text(s2, encoding='utf-8')
      - name: Commit mobile asset loader
        shell: bash
        run: |
          set -e
          if git diff --quiet -- index.html; then
            echo 'Mobile assets already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load full plant editor v4.1.0'
          git push
