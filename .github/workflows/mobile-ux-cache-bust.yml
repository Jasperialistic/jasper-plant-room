name: Mobile UX cache bust

on:
  push:
    paths:
      - 'v25-photo-viewer.js'

permissions:
  contents: write

jobs:
  bump-viewer-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump mobile viewer asset version
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s2, n = re.subn(r'v25-photo-viewer\.js(?:\?v=[^"\']*)?', 'v25-photo-viewer.js?v=3.8.0', s)
          if n == 0:
              raise SystemExit('v25-photo-viewer.js script tag not found')
          p.write_text(s2, encoding='utf-8')
      - name: Commit cache bust
        shell: bash
        run: |
          set -e
          if git diff --quiet -- index.html; then
            echo 'Already on v3.8.0'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load mobile UX viewer v3.8.0'
          git push
